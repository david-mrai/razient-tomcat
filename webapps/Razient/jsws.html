<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <META HTTP-EQUIV="Pragma" CONTENT="no-cache">
    <LINK href="css/tk.css" rel="stylesheet" type="text/css">
    <script language="javascript">
    var xmlhttp;
    function gup( name ){
		var regexS = "[\\?&]"+name+"=([^&#]*)";
		var regex = new RegExp ( regexS );
		var tmpURL = window.location.href;
		var results = regex.exec( tmpURL );
		if( results == null )
			return"";
		else
			return results[1];
	}

    function init() {
       // put more code here in case you are concerned about browsers that do not provide XMLHttpRequest object directly
       xmlhttp = new XMLHttpRequest();
       getdetails();
    }
    function getdetails() {

        var empno = document.getElementById("empno");
        //var url = "http://localhost:8084/webservicedemo/resources/employee/" + empno.value;
        var param_id = gup( 'id' );
        var param_type = gup( 'type' );
		var url = "http://www.razient.com/Razient/service/ws/general/ticket/id="+param_id+"/type="+param_type+".json";
		
        xmlhttp.open('GET',url,true);
        xmlhttp.send(null);
        
        document.getElementById('tk').innerHTML=' Ticket Exist.';

        xmlhttp.onreadystatechange = function() {

               var empname =  document.getElementById("empname");
               var age =  document.getElementById("age");
               if (xmlhttp.readyState == 4) {
			   //alert(xmlhttp.responseText);
			   var jsondoc = eval('(' + xmlhttp.responseText + ')');
			   
                 if ( xmlhttp.status == 200) {
                 }
                 else
                       alert("Error ->" + xmlhttp.responseText);
                       
                 
                 if(jsondoc.general !=undefined ){
                 	displayData(jsondoc);
                 }
                 
                 
              }
        };
		
		
    }
    
    
	function createTableRowContent(rowObject, data, cellType,type){
		var cell;
		var rowContent = document.createElement(cellType);
		if(type == 'link'){
			cell=document.createElement("a");
			cell.setAttribute("href",data);
			cell.appendChild(document.createTextNode('Link'));
		}else
		if(type == 'txa'){
			cell=document.createElement('textarea');
			cell.setAttribute("cols","50");
			cell.setAttribute("rows","4");
			cell.setAttribute("class","fieldtextareacommentbuilt");		
			cell.appendChild(document.createTextNode(data));
		}else{
			cell = document.createTextNode(data);
		}
		rowContent.appendChild(cell);
		rowObject.appendChild(rowContent);
		
	}
	
	function createTableData(rowObject, data,type){
		createTableRowContent(rowObject, data, 'td',type);
	}
	
	function createTableHeader(rowObject, data){
		createTableRowContent(rowObject, data, 'th','');
	}
	
	function displayData(jsonString){
		var table = document.createElement('table');

		
		var thead = document.createElement('thead');
		table.appendChild(thead);
		
		var row = document.createElement('tr');
		
		if(jsonString.general.rititle!=null){
			createTableHeader(row, 'Title');
			createTableHeader(row, 'Description');
			createTableHeader(row, 'City');
			createTableHeader(row, 'State');
			createTableHeader(row, 'Country');
			createTableHeader(row, 'Url');
			
			thead.appendChild(row);
			
		}

		var tbody = document.createElement('tbody');
		table.appendChild(tbody);

			var row = document.createElement('tr');
			
			
			if(jsonString.general.rititle!=null){
				createTableData(row, jsonString.general.rititle,'');
				createTableData(row, jsonString.general.ridescription,'txa');
				createTableData(row, jsonString.general.ricity,'');
				createTableData(row, jsonString.general.ristate,'');
				createTableData(row, jsonString.general.ricountry,'');
				createTableData(row, jsonString.general.riurl,'link');
				
				document.getElementById('tk').innerHTML='Ticket has been created.';
				document.getElementById('in').innerHTML='Incident.';
			}
					
			tbody.appendChild(row);

		document.getElementById('mytable').innerHTML = '';
		document.getElementById('mytable').appendChild(table);
		
		
	}
    
  </script>
  </head>
  <body class="body_indextk" onload="init()">
  <div>
   			<div class="header_tk_container">
   				<div class="header_tk_content">
   <br/><br/><br/><br/>
   <hr>
   <h1><div id="tk"></div></h1>
    <h1><div id="in"></div></h1>
	<p><div id="mytable"></div></p>
	<hr>
</div>
</div>
</div>
  </body>
</html>
