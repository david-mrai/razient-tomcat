rz_login.tab1.title	=What is the framework?

rz_login.tab1.name	= Razient
rz_login.tab1.info1	= is a "Software as a Service" (SaaS) solution that provides a process for managing and reporting on risk in the Supply Chain. <br/> Supply chain risk is about threat and vulnerability mapping. this  mapping  consists  of  understanding  and  defining supply chain  risk, planning  for supply chain  risk contingencies,  identifying threats from a compliance and global incident perspective and business  continuity  planning.
rz_login.tab1.info2	= Implementing the process for Supply Chain Risk Management as defined by the Razient application allows a company the capability to gather and analyze information about the supplier network, provide a centralized web application to monitor and report on incidents, threats and controls, identify physical, logical and geo-political threats, and allows a company to work with the supplier to develop mitigation tactics and improve the risk reduction decision making process. <br/> Our correlation dashboard provides real-time and centralized reporting and alerting on a daily basis.


rz_login.tab2.title	=What can I build?

rz_login.tab2.name	= Razient
rz_login.tab2.info1	= helps you risk rate and monitor suppliers based on risk assessment metrics and criteria for threat management. <br/> It allows you to prioritize the impact of supplier risk, alert you to the appropriate controls necessary to reduce risk, and track suppliers Business Continuity planning capabilities. We use a survey process that can utilize regulatory compliance questions such as PCI,SoX, HIPAA, FFIEC, FISMA and more.
rz_login.tab2.info2	= 

rz_login.tab3.title	=Value Proposition.

rz_login.tab3.name	= The supply chain risk
rz_login.tab3.info1	= reduction analysis that can be provided by Razient allows a company to know if a supplier has physical and logical risk and understand disruptions in the supply chain.
rz_login.tab3.info2	=



