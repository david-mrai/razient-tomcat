rz_login.tab1.title	=Que es el framework?

rz_login.tab1.name	= Razient
rz_login.tab1.info1	= es una solución de "Software as a Service" (SaaS), que provee un servicio de gestión y presentación de informes sobre el riesgo en la cadena de suministros.<br/>Este proceso abarca todo lo concerniente al mapeo de amenazas y vulnerabilidades; este mapeo consiste en la definición y entendimiento de planes de contingencia, identificación de las amenazas, perspectiva global del incidente y planificación de la continuidad del negocio.

rz_login.tab1.info2	= la implementación del proceso para la gestión de las amenazas, en la cadena de suministros como es definido por la aplicación Razient, les permitirá a las compañías tener la capacidad de reunir y analizar información sobre la red de proveedores, proporcionar una aplicación web centralizada para monitorizar y reportar incidentes y controles; E identificar asuntos físicos, lógicos y geopolíticos. Les  permitirá también trabajar con los proveedores en el desarrollo de estrategias para la reducción del peligro.<br/> Nuestro panel de correlación proporciona diariamente y en tiempo real reportes y alertas.


rz_login.tab2.title	=Que puedo construir?

rz_login.tab2.name	= Razient
rz_login.tab2.info1	= le ayudará a calificar y monitorizar el riesgo de los proveedores basado en indicadores de evaluación y criterios para la gestión de amenazas. <br/> También le permitirá dar prioridad a los efectos del incidente en los proveedores, seguirle la pista a las capacidades de planeacion de continuidad de negocio de estos, y ademas, le alertara para tomar el control y las medidas necesarias para reducir el peligro. Nosotros usamos un proceso de encuestas que utilizan un sistema directo de preguntas como:  PCI, SoX, HIPAA, FFIEC, FISMA y mas.
rz_login.tab2.info2	= 

rrz_login.tab3.title	=Propuesta de valor.

rz_login.tab3.name	= El riesgo en la cadena de suministros
rz_login.tab3.info1	= El analisis de la reduccion puede ser provisto por Razient, permitiendo a las compañias saber si un proveedor tiene un riesgo físico o lógico y comprender las interrupciones en la cadena.
rz_login.tab3.info2	=




